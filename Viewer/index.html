<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPI Viewer</title>
    <link rel="stylesheet" href="swagger-ui.css" />
    <link rel="stylesheet" href="viewer.css" />
    <script defer src="viewer.js"></script>
  </head>
  <body>
    <div id="viewer-shell">
      <aside id="outline-sidebar" aria-label="Document outline" hidden>
        <button
          id="outline-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="outline-tree"
          aria-label="Hide outline"
          title="Hide outline"
        ></button>
        <nav id="outline-tree" aria-label="OpenAPI document outline"></nav>
      </aside>
      <main id="swagger-ui" aria-live="polite"></main>
    </div>
  </body>
</html>
